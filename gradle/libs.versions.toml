[versions]
agp = "8.7.3"
junit = "4.13.2"
orgjson = "20240303"
# 1.9.4 is the newest Media3 that builds against compileSdk 35 (1.10+ needs 36).
media3 = "1.9.4"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# The real org.json for JVM unit tests (android.jar only has stubs that throw).
orgjson = { module = "org.json:json", version.ref = "orgjson" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
androidx-annotation-experimental = { module = "androidx.annotation:annotation-experimental", version = "1.4.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
