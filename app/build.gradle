plugins { alias(libs.plugins.android.application) }

android {
    namespace 'app.tuberipper.player'
    compileSdk 35
    defaultConfig {
        applicationId 'app.tuberipper.player'
        minSdk 26
        // 34, not 35: Android 15 forces edge-to-edge on apps that target 35, which would draw the web page under the system bars.
        targetSdk 34
        versionCode 11
        versionName '1.10'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        // Only when the keystore is given (TR_KEYSTORE + TR_KS_PASS): CI builds an unsigned release instead.
        if (System.getenv('TR_KEYSTORE')) {
            release {
                storeFile file(System.getenv('TR_KEYSTORE'))
                storePassword System.getenv('TR_KS_PASS')
                keyAlias 'tuberipper'
                keyPassword System.getenv('TR_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('TR_KEYSTORE')) signingConfig signingConfigs.release
            // R8: shrinks and optimizes. Names are kept (no obfuscation, see proguard-rules.pro) and the
            // methods the web page calls through TRNative are kept explicitly.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError true          // a lint error fails the build
        checkReleaseBuilds true
        warningsAsErrors false
        // Deliberate choices, explained where they are made:
        disable 'OldTargetApi'     // targetSdk 34 on purpose (edge-to-edge, see above)
        disable 'GradleDependency' // version bumps are done on purpose, not by lint
        disable 'SetJavaScriptEnabled', 'JavascriptInterface' // the app IS a WebView around our own page
    }
    testOptions {
        unitTests.all { testLogging { events 'failed'; exceptionFormat 'full' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.media3.exoplayer
    implementation libs.media3.session
    implementation libs.androidx.annotation
    implementation libs.androidx.annotation.experimental
    testImplementation libs.junit
    testImplementation libs.orgjson
}
